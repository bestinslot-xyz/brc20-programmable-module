name: Docker Publish

# Builds and publishes the brc20-prog image to Docker Hub.
#
# Triggers:
#   - pushing a version tag (e.g. v0.16.0) publishes :0.16.0, :0.16, :0 and :latest
#   - manual dispatch builds the image without pushing (useful for verifying the
#     Dockerfile on a branch)
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub user/org with push access to the image repo
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not the account password)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: bestinslot/brc20-prog

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only log in when we intend to push (tag builds). Manual runs build only.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 only for now. arm64 builds rocksdb from source under
          # QEMU emulation, which is very slow in CI; add linux/arm64 here once
          # a native arm64 runner or a longer build budget is available.
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
